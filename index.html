<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>watch it think</title>
    <meta
      name="description"
      content="A five million parameter model, trained from random init, resolving a sentence into an intent in your browser."
    />
  </head>
  <body>
    <header>
      <span class="wordmark">watch it think</span>
      <!--
        The headline gives a reason, not a specification. It used to read "Five
        million parameters, running on your machine", and the recruiter audit's
        note on it was that a parameter count is not a reason to stay: thirty
        eight of forty candidates wrap somebody else's model in an API call, and
        a number does not tell you which kind this is.
      -->
      <h1 data-headline>I trained this model. Watch it think.</h1>
      <p class="standfirst" data-standfirst></p>
    </header>

    <main>
      <label class="sr-only" for="input">A sentence for the model</label>
      <textarea id="input" rows="2" spellcheck="false" autocomplete="off"></textarea>

      <div class="samples" data-samples></div>

      <!--
        Telemetry, and deliberately not a live region any more. It changes on
        every keystroke, so announcing it meant a screen reader read out
        "6 positions, 6 layers, 4 heads, 3.0 ms" over and over while the one
        number this page computes was never spoken at all.

        The announcement moved to [data-announce] below, which says the answer.
      -->
      <p class="status" data-status>loading the model</p>

      <!--
        And the one case where "loading the model" is a lie.

        With javascript off nothing here ever runs, so that line would say
        loading for as long as the visitor stayed, and it is told to exactly the
        people most likely to have turned scripts off deliberately. The hostile
        stranger pass found it on 21 September and again on the 23rd.

        It replaces the status line rather than sitting beside it, because two
        sentences that contradict each other are worse than either.
      -->
      <noscript>
        <style>
          [data-status] { display: none }
        </style>
        <p class="status" data-noscript>
          This page runs a five million parameter model in your browser, so it
          needs javascript to do anything at all. Nothing is sent anywhere
          either way: the model runs on your machine anyway, which is the whole
          point of it. The training code and the numbers are at
          <a href="https://github.com/Broikos-Nikos/bslm">github.com/Broikos-Nikos/bslm</a>.
        </p>
      </noscript>

      <!--
        What a screen reader is told. Polite, atomic, and written once per
        settled prediction rather than per keystroke: the intent, its
        confidence, the arguments it pulled out, and what the attention grid
        shows, which is otherwise twenty five canvases carrying no text at all.
      -->
      <p class="sr-only" role="status" aria-live="polite" aria-atomic="true" data-announce></p>

      <section class="result" data-result hidden>
        <h2 class="sr-only">The answer</h2>
        <div class="verdict">
          <span class="intent" data-intent></span>
          <span class="confidence" data-confidence></span>
        </div>

        <h3 class="sr-only">The six likeliest intents</h3>
        <ol class="race" data-race></ol>

        <h3 class="sr-only">The words, and the arguments it pulled out of them</h3>
        <div class="tags" data-tags></div>

        <section class="attention" aria-label="Attention">
          <div class="attention-head">
            <h2>What it looked at</h2>
            <p class="attention-note" data-attention-note></p>
          </div>

          <div class="attention-body">
            <!--
              Twenty four fields for one sentence. The point is not any single
              one of them, it is how they differ, so all of them are on screen
              and one is large.
            -->
            <div class="heads" data-heads role="tablist" aria-label="Layer and head"></div>

            <figure class="field">
              <canvas data-field width="520" height="520" role="img" data-field-alt></canvas>
              <figcaption data-field-caption></figcaption>
            </figure>
          </div>

          <ol class="axis" data-axis aria-label="Tokens, in order"></ol>
        </section>
      </section>
    </main>

    <footer data-footer></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
